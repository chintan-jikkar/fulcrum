name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # The ledger tests run against real Postgres; credentials match docker-compose.yml (CI only).
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: fulcrum
          POSTGRES_PASSWORD: fulcrum
          POSTGRES_DB: fulcrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fulcrum"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # The TypeScript client is generated from the API's OpenAPI schema (CLAUDE.md §6). This job
  # regenerates it and fails if the checked-in copy is stale, then type-checks and builds the app.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - run: git diff --exit-code packages/api-client
      - run: npm run build
        working-directory: web

  # Proves the P0 exit criterion (`docker compose up` works) on every push.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --detach
      # api has no healthcheck, so --wait returns before uvicorn listens; the first request can be reset.
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - if: failure()
        run: docker compose logs
