name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # Proves the P0 exit criterion (`docker compose up` works) on every push.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --detach
      # api has no healthcheck, so --wait returns before uvicorn listens; the first request can be reset.
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health
      - if: failure()
        run: docker compose logs
